<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm Nhân Viên Mới</title>
    <!-- Nhúng Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-success text-white py-3">
                    <h4 class="mb-0">Thêm Nhân Viên Mới</h4>
                </div>

                <div class="card-body p-4">
                    <form th:action="@{/employees/save}" th:object="${employee}" method="post">

                        <!-- Tên nhân viên -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tên Nhân Viên:</label>
                            <input type="text" th:field="*{name}" class="form-control"
                                   placeholder="Ví dụ: Nguyễn Văn A"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{name}">Lỗi tên</div>
                        </div>

                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-bold">Email:</label>
                            <input type="email" th:field="*{email}" class="form-control"
                                   placeholder="nguyenvana@gmail.com"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:errors="*{email}">Lỗi email</div>
                        </div>

                        <!-- Chọn phòng ban -->
                        <div class="mb-4">
                            <label class="form-label fw-bold">Phòng Ban:</label>
                            <select th:field="*{department.id}" class="form-select">
                                <option value="">-- Chọn phòng ban --</option>
                                <option th:each="dept : ${departments}"
                                        th:value="${dept.id}"
                                        th:text="${dept.name}"></option>
                            </select>
                        </div>

                        <!-- Nút thao tác -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/employees/list}" class="btn btn-outline-secondary">
                                &larr; Quay lại
                            </a>
                            <button type="submit" class="btn btn-success px-4">
                                Lưu Nhân Viên
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
