<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Nhân Viên</title>
    <!-- Nhúng Bootstrap CSS xịn từ CDN mới nhất -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-3">
            <h4 class="mb-0">Quản Lý Nhân Viên</h4>
            <div>
                <a th:href="@{/employees/statistics}" class="btn btn-warning fw-bold me-2">📊 Thống Kê</a>
                <a th:href="@{/employees/add}" class="btn btn-success fw-bold">+ Thêm Nhân Viên</a>
            </div>
        </div>

        <div class="card-body">
            <!-- Thanh tìm kiếm -->
            <form th:action="@{/employees/list}" method="get" class="row g-2 mb-4">
                <div class="col-md-10">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Nhập tên hoặc phòng ban để tìm kiếm...">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </form>

            <!-- Bảng danh sách -->
            <div class="table-responsive">
                <table class="table table-hover table-bordered align-middle">
                    <thead class="table-dark">
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Tên Nhân Viên</th>
                        <th scope="col">Email</th>
                        <th scope="col">Phòng Ban</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Nếu danh sách CÓ dữ liệu -->
                    <tr th:unless="${#lists.isEmpty(employees)}" th:each="emp : ${employees}">
                        <td th:text="${emp.id}">1</td>
                        <td th:text="${emp.name}" class="fw-bold">Nguyễn Văn A</td>
                        <td th:text="${emp.email}">a@gmail.com</td>
                        <td>
                                    <span class="badge bg-info text-dark"
                                          th:text="${emp.department != null ? emp.department.name : 'Chưa phân công'}">IT</span>
                        </td>
                    </tr>

                    <!-- Nếu danh sách RỖNG -->
                    <tr th:if="${#lists.isEmpty(employees)}">
                        <td colspan="4" class="text-center py-4 text-muted">
                            <i>Không tìm thấy nhân viên nào trong hệ thống!</i>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
</div>

</body>
</html>
