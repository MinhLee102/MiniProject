<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Báo Cáo & Thống Kê</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-primary fw-bold">Báo Cáo & Thống Kê Nhân Sự</h2>
        <a th:href="@{/employees/list}" class="btn btn-outline-secondary">&larr; Danh sách nhân viên</a>
    </div>

    <!-- Thẻ Card Tổng số nhân viên -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card bg-primary text-white shadow-sm">
                <div class="card-body py-4 text-center">
                    <h6 class="text-uppercase tracking-wide">Tổng Số Nhân Viên</h6>
                    <h1 class="display-4 fw-bold mb-0" th:text="${totalEmployees}">0</h1>
                </div>
            </div>
        </div>
    </div>

    <!-- Bảng thống kê theo phòng ban -->
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white py-3">
            <h5 class="mb-0">Phân Bổ Nhân Sự Theo Phòng Ban</h5>
        </div>
        <div class="card-body p-0">
            <table class="table table-hover table-striped mb-0 align-middle">
                <thead class="table-light">
                <tr>
                    <th scope="col" class="ps-4">Tên Phòng Ban</th>
                    <th scope="col" class="text-center">Số Lượng Nhân Viên</th>
                    <th scope="col" class="text-center">Tỉ Lệ (%)</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="stat : ${departmentStats}">
                    <td class="ps-4 fw-semibold" th:text="${stat.departmentName}">Phòng Kỹ Thuật</td>
                    <td class="text-center">
                        <span class="badge bg-success fs-6" th:text="${stat.employeeCount}">0</span>
                    </td>
                    <td class="text-center" th:text="${totalEmployees > 0 ? #numbers.formatDecimal((stat.employeeCount * 100.0 / totalEmployees), 1, 1) + '%' : '0%'}">0%</td>
                </tr>
                <tr th:if="${#lists.isEmpty(departmentStats)}">
                    <td colspan="3" class="text-center py-4 text-muted">Chưa có dữ liệu thống kê!</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
